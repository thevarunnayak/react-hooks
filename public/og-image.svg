<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Rect -->
  <rect width="1200" height="630" fill="#090d16" />

  <!-- Ambient Radial Lighting -->
  <defs>
    <radialGradient id="bgGlowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowRight" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brandHookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlowLeft)" />
  <rect width="1200" height="630" fill="url(#bgGlowRight)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Container Box -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon -->
    <g transform="translate(0, 10) scale(2.4)">
      <!-- React Orbital Ellipses -->
      <ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(-30 24 24)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.85" stroke-dasharray="4 2" />
      <ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(30 24 24)" stroke="#ec4899" stroke-width="2" stroke-opacity="0.85" stroke-dasharray="4 2" />
      <!-- Signature Hook Path -->
      <path d="M16 14C16 9.58 19.58 6 24 6C28.42 6 32 9.58 32 14C32 20 25 24 22 28C19 32 18 36 21 39.5C24 43 29 42 32 38.5C34 36 34.5 33 33 30.5" stroke="url(#brandHookGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Nucleus -->
      <circle cx="24" cy="14" r="3.2" fill="#ffffff" />
      <circle cx="24" cy="14" r="5" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="33" cy="30.5" r="2.2" fill="#ec4899" />
    </g>

    <!-- Brand Header -->
    <g transform="translate(140, 25)">
      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-2px">ReactLabz</text>
      <rect x="330" y="8" width="84" height="30" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(165, 180, 252, 0.4)" stroke-width="1" />
      <text x="372" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5px">STUDIO</text>
    </g>

    <!-- Tagline & Description -->
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="32" font-weight="600" fill="#f8fafc" letter-spacing="-0.5px">Interactive React Hooks Studio &amp; Architecture Lab</text>
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Deep mental models, interactive visualizers, custom hooks catalog, live playground &amp; challenges.</text>

    <!-- Pill Feature Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="42" rx="21" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">React 19 Hooks</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="180" height="42" rx="21" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <circle cx="202" cy="21" r="5" fill="#a855f7" />
      <text x="216" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">40+ Custom Hooks</text>

      <!-- Badge 3 -->
      <rect x="375" y="0" width="190" height="42" rx="21" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <circle cx="397" cy="21" r="5" fill="#10b981" />
      <text x="411" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Visual Playground</text>

      <!-- Badge 4 -->
      <rect x="580" y="0" width="195" height="42" rx="21" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <circle cx="602" cy="21" r="5" fill="#f59e0b" />
      <text x="616" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Interview Practice</text>
    </g>

    <!-- Domain Footer -->
    <g transform="translate(0, 395)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#6366f1">https://reactlabz.vercel.app</text>
    </g>
  </g>
</svg>
